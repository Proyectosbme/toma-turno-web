<div class="form-panel-wrapper">

  <form [formGroup]="form" class="form-panel-grid"
    [ngStyle]="{'grid-template-columns': 'repeat(' + columns + ', 1fr)'}">
    <ng-container *ngFor="let field of fields">
      <div class="field" [class.form-field-full]="field.fullWidth"
           [class.field-invalid]="form.get(field.name)?.invalid && form.get(field.name)?.touched">
        <label [for]="field.name">{{ field.label }}</label>

        <ng-container *ngIf="field.type === 'select'">
          <select [id]="field.name" class="form-select" [formControlName]="field.name"
                  [class.input-error]="form.get(field.name)?.invalid && form.get(field.name)?.touched">
            <option [ngValue]="null">{{ field.placeholder || 'Selecciona una opción' }}</option>
            <option *ngFor="let opt of field.options" [ngValue]="opt.value">{{ opt.label }}</option>
          </select>
        </ng-container>

        <ng-container *ngIf="field.type !== 'select' && field.mask">
          <p-inputMask
            [id]="field.name"
            [mask]="field.mask"
            [formControlName]="field.name"
            [placeholder]="field.placeholder || field.mask"
            [class.input-error]="form.get(field.name)?.invalid && form.get(field.name)?.touched"
            styleClass="w-full"
          />
        </ng-container>

        <ng-container *ngIf="field.type !== 'select' && !field.mask">
          <input
            [id]="field.name"
            [type]="field.type || 'text'"
            pInputText
            [formControlName]="field.name"
            [placeholder]="field.placeholder || ''"
          />
        </ng-container>

        <ng-container *ngIf="form.get(field.name)?.invalid && form.get(field.name)?.touched">
          <small class="field-error-msg" *ngIf="form.get(field.name)?.hasError('required')">
            {{ field.label }} es requerido.
          </small>
          <small class="field-error-msg" *ngIf="form.get(field.name)?.hasError('maxlength')">
            {{ field.label }} excede el máximo de {{ form.get(field.name)?.getError('maxlength')?.requiredLength }} caracteres.
          </small>
          <small class="field-error-msg" *ngIf="form.get(field.name)?.hasError('email')">
            {{ field.label }} no tiene un formato válido.
          </small>
          <small class="field-error-msg" *ngIf="form.get(field.name)?.hasError('pattern')">
            {{ field.label }} contiene caracteres no permitidos.
          </small>
        </ng-container>
      </div>
    </ng-container>
  </form>
</div>
