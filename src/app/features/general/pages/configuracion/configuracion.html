<p-toast position="top-right"></p-toast>
<app-page-layout>

    <!-- ═══ HEADER ═══ -->
    <app-page-title title="Configuraciones del Sistema" page-header-title></app-page-title>
    <ng-container page-header-actions>
        <button pButton icon="pi pi-plus" label="Agregar" (click)="abrirNuevo()"
            pTooltip="Crear nueva configuración"></button>
        <button pButton icon="pi pi-pencil" label="Editar" class="p-button-secondary p-button-outlined"
            [disabled]="!configSeleccionada" (click)="abrirEditar()"
            pTooltip="Editar configuración seleccionada"></button>
    </ng-container>

    <!-- ═══ CONTENT ═══ -->
    <div page-content>

        <!-- Sección: Apariencia -->
        <app-section title="Apariencia de la Empresa">
            <div class="branding-form">

                <!-- Nombre -->
                <div class="branding-field">
                    <label for="nombreEmpresaInput">Nombre de la empresa</label>
                    <div class="branding-input-row">
                        <input id="nombreEmpresaInput" pInputText [(ngModel)]="nombreInput"
                            placeholder="Ej: Mi Empresa S.A."
                            maxlength="60" />
                        <button pButton icon="pi pi-check" label="Aplicar"
                            (click)="guardarNombre()"
                            [loading]="guardandoNombre"
                            [disabled]="!nombreInput.trim()">
                        </button>
                    </div>
                    <small class="branding-hint">
                        Se muestra en el topbar y el footer. Actual: <strong>{{ branding.nombreEmpresa() }}</strong>
                    </small>
                </div>

                <!-- Logo -->
                <div class="branding-field">
                    <label for="logoInput">Logo de la empresa</label>
                    <div class="branding-logo-row">
                        <div class="branding-logo-preview">
                            <img [src]="branding.logoUrl() || '/images/logo.svg'"
                                (error)="$any($event.target).src='/images/logo.svg'"
                                alt="Logo actual" class="branding-logo-img" />
                        </div>
                        <div class="branding-logo-actions">
                            <label class="branding-upload-btn" [class.disabled]="guardandoLogo"
                                pTooltip="Seleccionar imagen (JPEG, PNG u otro formato)">
                                <i class="pi" [ngClass]="guardandoLogo ? 'pi-spin pi-spinner' : 'pi-upload'"></i>
                                {{ guardandoLogo ? 'Subiendo...' : 'Subir logo' }}
                                <input id="logoInput" type="file" accept="image/*"
                                    (change)="onLogoSeleccionado($event)"
                                    [disabled]="guardandoLogo" hidden />
                            </label>
                        </div>
                    </div>
                    <small class="branding-hint">Se guarda en la base de datos y se aplica en toda la aplicación.</small>
                </div>

                <!-- Banner -->
                <div class="branding-field">
                    <label for="bannerInput">Banner del inicio</label>
                    <div class="branding-banner-preview">
                        <img [src]="branding.bannerUrl() || '/images/banner.svg'"
                                (error)="$any($event.target).src='/images/banner.svg'"
                                alt="Banner actual" />
                    </div>
                    <div class="branding-logo-actions" style="margin-top: 0.5rem;">
                        <label class="branding-upload-btn" [class.disabled]="guardandoBanner"
                            pTooltip="Seleccionar imagen (JPEG, PNG u otro formato)">
                            <i class="pi" [ngClass]="guardandoBanner ? 'pi-spin pi-spinner' : 'pi-upload'"></i>
                            {{ guardandoBanner ? 'Subiendo...' : 'Subir banner' }}
                            <input id="bannerInput" type="file" accept="image/*"
                                (change)="onBannerSeleccionado($event)"
                                [disabled]="guardandoBanner" hidden />
                        </label>
                    </div>
                    <small class="branding-hint">Se guarda en la base de datos y se muestra en la pantalla de inicio.</small>
                </div>

            </div>
        </app-section>

        <!-- Sección: Búsqueda -->
        <app-section id="sec-busqueda" title="Búsqueda por sucursal">
            <app-search-panel [form]="formularioBusqueda" [fields]="camposBusqueda" [columns]="2"
                (searchAction)="buscar()" (clearAction)="limpiarBusqueda()">
            </app-search-panel>
            @if (advertenciaBusqueda) {
                <p class="advertencia-busqueda">
                    <i class="pi pi-exclamation-triangle"></i> {{ advertenciaBusqueda }}
                </p>
            }
        </app-section>

        <!-- Sección: Tabla -->
        <app-section id="sec-tabla" title="Listado de Configuraciones">
            <app-table [items]="configuraciones" [columns]="columnas" [isLoading]="cargando"
                [selectedItem]="configSeleccionada"
                emptyTitle="Sin configuraciones registradas"
                emptySubtitle="Selecciona una sucursal y consulta, o presiona Agregar para crear una configuración."
                (rowSelect)="seleccionarConfig($event)">
            </app-table>
        </app-section>
    </div>

</app-page-layout>

<!-- ═══ DIALOG: Crear / Editar ═══ -->
<p-dialog [header]="dialogoTitulo" [(visible)]="dialogoVisible" [modal]="true" [closable]="true" [draggable]="false"
    [style]="{ width: '42rem' }">

    <app-form-panel [form]="formularioConfig" [fields]="camposFormulario" [columns]="2"></app-form-panel>

    <ng-template #footer>
        <div class="dialog-footer">
            <button pButton icon="pi pi-times" label="Cancelar" class="p-button-sm p-button-text"
                (click)="cerrarDialogo()"></button>
            <button pButton icon="pi pi-check" label="Guardar" class="p-button-sm" (click)="guardar()"
                [loading]="cargando"></button>
        </div>
    </ng-template>

</p-dialog>
