<div class="home-container">

    <div class="card mb-4 header-card">
        <h5 class="header-title">
            BIENVENIDO A {{ branding.nombreEmpresa() | uppercase }}
        </h5>

        <div class="header-right" *ngIf="auth.isLoggedIn()">
            <p class="m-0 session-text">
                <span class="text-primary fw-semibold">{{ auth.getNombreCompleto() }}</span>
            </p>
            <p class="m-0 session-text">
                Perfil: {{ auth.getPerfil() }}
            </p>
            <p class="m-0 session-text" *ngIf="auth.getUsuario()?.nombreSucursal">
                Sucursal: {{ auth.getUsuario()?.nombreSucursal }}
            </p>
        </div>
    </div>

    <div class="banner-wrapper" *ngIf="branding.bannerUrl()">
        <img [src]="branding.bannerUrl()" (error)="$any($event.target).hidden=true" alt="Banner empresa" />
    </div>

</div>
