<div class="home-container">

    <div class="card mb-4 header-card">
        <h5 class="header-title">
            BIENVENIDO A {{ branding.nombreEmpresa() | uppercase }}
        </h5>

        <div class="header-right">
            <p class="m-0 session-text">
                Última sesión: {{ sessionInfo.lastSessionDate }}
            </p>
            <p class="m-0 session-text">
                Duración: {{ sessionInfo.sessionDuration }}
            </p>
            <p class="m-0 session-text">
                Cierre:
                <span class="text-primary">Por usuario</span>
            </p>
        </div>
    </div>

    <div class="banner-wrapper">
        <img [src]="branding.bannerUrl() ?? '/images/banner.png'" alt="Banner empresa" />
    </div>

</div>
