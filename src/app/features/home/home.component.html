<div class="home-container">

    <div class="card mb-4 header-card">
        <h5 class="header-title">
            BIENVENIDO A {{ branding.nombreEmpresa() | uppercase }}
        </h5>

        <div class="header-right" *ngIf="usuario">
            <p class="m-0 session-text">
                <span class="text-primary fw-semibold">{{ usuario.nombres }} {{ usuario.apellidos }}</span>
            </p>
            <p class="m-0 session-text">
                Perfil: {{ usuario.perfil }}
            </p>
            <p class="m-0 session-text">
                Sucursal: {{ usuario.nombreSucursal }}
            </p>
        </div>
    </div>

    <div class="banner-wrapper">
        <img [src]="branding.bannerUrl() || '/images/banner.svg'" (error)="$any($event.target).src='/images/banner.svg'" alt="Banner empresa" />
    </div>

</div>
