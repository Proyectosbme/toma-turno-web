        <app-floating-configurator />
        <div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
            <div class="flex flex-col items-center justify-center">
                <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
                    <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                        <div class="text-center mb-8">
                            <img *ngIf="branding.logoUrl()"
                                [src]="branding.logoUrl()"
                                alt="Logo"
                                style="height: 64px; object-fit: contain; margin: 0 auto 0.75rem;" />
                            <i *ngIf="!branding.logoUrl()"
                                class="pi pi-ticket text-primary"
                                style="font-size: 3rem;"></i>
                            <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mt-4 mb-2">
                                {{ branding.nombreEmpresa() }}
                            </div>
                            <span class="text-muted-color font-medium">Inicie sesión para continuar</span>
                        </div>

                        <div>
                            <label for="sucursal" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Sucursal</label>
                            <p-select inputId="sucursal"
                                [options]="opcionesSucursales"
                                [(ngModel)]="idSucursal"
                                optionLabel="label"
                                optionValue="value"
                                placeholder="Seleccionar sucursal"
                                [style]="{ width: '100%', marginBottom: '1.5rem' }">
                            </p-select>

                            <label for="codigoUsuario" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Usuario</label>
                            <input pInputText id="codigoUsuario" type="text" placeholder="Código de usuario"
                                   class="w-full md:w-120 mb-6"
                                   [(ngModel)]="codigoUsuario"
                                   (keyup.enter)="iniciarSesion()" />

                            <label for="contrasena" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Contraseña</label>
                            <p-password id="contrasena" [(ngModel)]="contrasena" placeholder="Contraseña"
                                        [toggleMask]="true" styleClass="mb-2" [fluid]="true" [feedback]="false">
                            </p-password>

                            @if (error) {
                                <div class="mt-3 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg text-red-600 dark:text-red-400 text-sm">
                                    {{ error }}
                                </div>
                            }

                            <p-button label="Iniciar Sesión" styleClass="w-full mt-6"
                                      [loading]="cargando"
                                      (onClick)="iniciarSesion()">
                            </p-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
